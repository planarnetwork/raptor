name: Test

on:
  pull_request:
    branches:
      - master

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ['22', '24', '26']
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.version }}
          cache: npm
      # `npm ci` rather than `npm install`, so what is tested is the lockfile in
      # the branch. A Renovate pull request is a lockfile change and nothing
      # else; `npm install` is free to re-resolve it and test something the
      # merge would not produce.
      - run: npm ci
      - run: npm test
